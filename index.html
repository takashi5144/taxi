<style>
/* FILE: variables.css */
:root {
  /* カラーパレット */
  --color-primary: #1a73e8;
  --color-primary-dark: #1557b0;
  --color-primary-light: #4a90e2;
  --color-secondary: #f9a825;
  --color-secondary-dark: #c17900;
  --color-accent: #00c853;
  --color-danger: #e53935;
  --color-warning: #ff9800;

  /* 背景色 */
  --bg-dark: #1a1a2e;
  --bg-medium: #16213e;
  --bg-light: #0f3460;
  --bg-card: #1e2a4a;
  --bg-card-hover: #253252;
  --bg-secondary: #1e2a4a;
  --bg-tertiary: #253252;
  --bg-surface: #f5f5f5;

  /* テキスト色 */
  --text-primary: #ffffff;
  --text-secondary: #b0b8c8;
  --text-muted: #6c757d;
  --text-dark: #1a1a2e;

  /* フォント */
  --font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-lg: 1.125rem;
  --font-size-xl: 1.5rem;
  --font-size-2xl: 2rem;

  /* スペーシング */
  --space-xs: 0.25rem;
  --space-sm: 0.5rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2rem;
  --space-2xl: 3rem;

  /* レイアウト */
  --header-height: 56px;
  --sidebar-width: 240px;
  --bottom-nav-height: 64px;
  --border-radius: 12px;
  --border-radius-sm: 8px;

  /* シャドウ */
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);

  /* トランジション */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
}

/* FILE: global.css */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-family);
  background-color: var(--bg-dark);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

#root {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a {
  color: var(--color-primary-light);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

/* スクロールバー */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg-medium);
}
::-webkit-scrollbar-thumb {
  background: var(--bg-light);
  border-radius: 3px;
}

/* ヘッダー */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--header-height);
  background: var(--bg-medium);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  padding: 0 var(--space-md);
  z-index: 1000;
  backdrop-filter: blur(10px);
}

.header__logo {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  font-weight: 700;
  font-size: var(--font-size-lg);
  color: var(--color-secondary);
  cursor: pointer;
}

@keyframes standbyPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

.header__logo .material-icons-round {
  font-size: 28px;
}

.header__nav {
  display: none;
}

.header__nav-btn {
  background: none;
  border: none;
  color: var(--text-secondary);
  padding: var(--space-sm) var(--space-md);
  border-radius: var(--border-radius-sm);
  cursor: pointer;
  font-size: var(--font-size-sm);
  font-family: var(--font-family);
  transition: all var(--transition-fast);
  display: flex;
  align-items: center;
  gap: var(--space-xs);
}

.header__nav-btn:hover,
.header__nav-btn.active {
  background: rgba(255,255,255,0.08);
  color: var(--text-primary);
}

.header__nav-btn.active {
  color: var(--color-primary-light);
}

.header__menu-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--text-primary);
  font-size: 24px;
  cursor: pointer;
  padding: var(--space-sm);
}

/* サイドバー */
.sidebar {
  position: fixed;
  top: var(--header-height);
  left: 0;
  width: var(--sidebar-width);
  height: calc(100vh - var(--header-height));
  background: var(--bg-medium);
  border-right: 1px solid rgba(255,255,255,0.06);
  padding: var(--space-md) 0;
  overflow-y: auto;
  z-index: 900;
  transition: transform var(--transition-normal);
}

.sidebar__section {
  padding: var(--space-sm) var(--space-md);
  margin-bottom: var(--space-sm);
}

.sidebar__section-title {
  font-size: var(--font-size-xs);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: var(--space-sm);
  padding: 0 var(--space-sm);
}

.sidebar__item {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-sm) var(--space-md);
  border-radius: var(--border-radius-sm);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
  font-size: var(--font-size-sm);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: var(--font-family);
}

.sidebar__item:hover {
  background: rgba(255,255,255,0.06);
  color: var(--text-primary);
}

.sidebar__item.active {
  background: rgba(26, 115, 232, 0.15);
  color: var(--color-primary-light);
}

.sidebar__item .material-icons-round {
  font-size: 20px;
}

/* メインコンテンツ */
.main-content {
  margin-top: var(--header-height);
  margin-left: var(--sidebar-width);
  padding: var(--space-lg);
  min-height: calc(100vh - var(--header-height));
  transition: margin-left var(--transition-normal);
}

/* ボトムナビ */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--bottom-nav-height);
  background: var(--bg-medium);
  border-top: 1px solid rgba(255,255,255,0.08);
  z-index: 1000;
}

.bottom-nav__items {
  display: flex;
  justify-content: space-around;
  align-items: center;
  height: 100%;
  padding: 0 var(--space-sm);
}

.bottom-nav__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: var(--font-size-xs);
  cursor: pointer;
  padding: var(--space-xs) var(--space-sm);
  border-radius: var(--border-radius-sm);
  transition: color var(--transition-fast);
  font-family: var(--font-family);
  min-width: 56px;
}

.bottom-nav__item .material-icons-round {
  font-size: 22px;
}

.bottom-nav__item.active {
  color: var(--color-primary-light);
}

.bottom-nav__item:hover {
  color: var(--text-primary);
}

/* カード */
.card {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--border-radius);
  padding: var(--space-lg);
  transition: all var(--transition-fast);
}

.card:hover {
  background: var(--bg-card-hover);
  border-color: rgba(255,255,255,0.1);
}

.card__title {
  font-size: var(--font-size-lg);
  font-weight: 700;
  margin-bottom: var(--space-sm);
}

.card__subtitle {
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
  margin-bottom: var(--space-md);
}

/* ボタン */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  padding: var(--space-sm) var(--space-lg);
  border: none;
  border-radius: var(--border-radius-sm);
  font-size: var(--font-size-sm);
  font-family: var(--font-family);
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
  white-space: nowrap;
}

.btn--primary {
  background: var(--color-primary);
  color: white;
}
.btn--primary:hover {
  background: var(--color-primary-dark);
}

.btn--secondary {
  background: rgba(255,255,255,0.08);
  color: var(--text-primary);
}
.btn--secondary:hover {
  background: rgba(255,255,255,0.14);
}

.btn--success {
  background: var(--color-accent);
  color: white;
}

.btn--danger {
  background: var(--color-danger);
  color: white;
}

.btn--icon {
  padding: var(--space-sm);
  border-radius: 50%;
}

.btn--ghost {
  background: transparent;
  color: var(--text-secondary);
}
.btn--ghost:hover {
  background: rgba(255,255,255,0.08);
}

/* グリッド */
.grid {
  display: grid;
  gap: var(--space-md);
}

.grid--2 { grid-template-columns: repeat(2, 1fr); }
.grid--3 { grid-template-columns: repeat(3, 1fr); }
.grid--4 { grid-template-columns: repeat(4, 1fr); }

/* ページタイトル */
.page-title {
  font-size: var(--font-size-xl);
  font-weight: 700;
  margin-bottom: var(--space-lg);
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

.page-title .material-icons-round {
  color: var(--color-secondary);
}

/* InfoPage内の子ページタイトルを非表示 */
.info-page-content .page-title {
  display: none;
}

/* 地図コンテナ */
.map-container {
  width: 100%;
  height: 500px;
  border-radius: var(--border-radius);
  overflow: hidden;
  position: relative;
  background: var(--bg-card);
}

.map-container--fullscreen {
  position: fixed;
  top: var(--header-height);
  left: var(--sidebar-width);
  right: 0;
  bottom: 0;
  height: auto;
  border-radius: 0;
  z-index: 500;
}

/* GPS情報パネル */
.gps-panel {
  background: rgba(26, 26, 46, 0.95);
  backdrop-filter: blur(10px);
  border-radius: var(--border-radius-sm);
  padding: var(--space-md);
  margin-top: var(--space-md);
  border: 1px solid rgba(255,255,255,0.1);
}

.gps-panel__row {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  font-size: var(--font-size-sm);
}

.gps-panel__label {
  color: var(--text-muted);
  min-width: 60px;
}

.gps-panel__value {
  color: var(--color-accent);
  font-weight: 500;
  font-family: 'Courier New', monospace;
}

/* ステータスバッジ */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: var(--font-size-xs);
  font-weight: 500;
}

.badge--success {
  background: rgba(0, 200, 83, 0.15);
  color: var(--color-accent);
}

.badge--warning {
  background: rgba(255, 152, 0, 0.15);
  color: var(--color-warning);
}

.badge--error {
  background: rgba(229, 57, 53, 0.15);
  color: var(--color-danger);
}

.badge--info {
  background: rgba(26, 115, 232, 0.15);
  color: var(--color-primary-light);
}

/* 開発ツール */
.dev-log-entry {
  display: flex;
  gap: var(--space-sm);
  padding: var(--space-sm) var(--space-md);
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: var(--font-size-sm);
  font-family: 'Courier New', monospace;
}

.dev-log-entry__time {
  color: var(--text-muted);
  white-space: nowrap;
}

.dev-log-entry__level {
  min-width: 50px;
  font-weight: 700;
}

.dev-log-entry__level--info { color: var(--color-primary-light); }
.dev-log-entry__level--warn { color: var(--color-warning); }
.dev-log-entry__level--error { color: var(--color-danger); }
.dev-log-entry__level--debug { color: var(--text-muted); }

.dev-log-entry__message {
  color: var(--text-secondary);
  word-break: break-all;
}

/* フォーム */
.form-group {
  margin-bottom: var(--space-md);
}

.form-label {
  display: block;
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
  margin-bottom: var(--space-xs);
}

.form-input {
  width: 100%;
  padding: var(--space-sm) var(--space-md);
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--border-radius-sm);
  color: var(--text-primary);
  font-size: var(--font-size-base);
  font-family: var(--font-family);
  transition: border-color var(--transition-fast);
}

.form-input:focus {
  outline: none;
  border-color: var(--color-primary);
}

/* 統計カード */
.stat-card {
  text-align: center;
  padding: var(--space-lg);
}

.stat-card__value {
  font-size: var(--font-size-2xl);
  font-weight: 700;
  color: var(--color-secondary);
}

.stat-card__label {
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
  margin-top: var(--space-xs);
}

/* ローディング */
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-2xl);
  gap: var(--space-md);
}

.loading__spinner {
  width: 40px;
  height: 40px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ファイルツリー */
.file-tree {
  font-family: 'Courier New', monospace;
  font-size: var(--font-size-sm);
  line-height: 1.8;
}

.file-tree__item {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  padding: 2px 0;
}

.file-tree__icon {
  font-size: 16px;
}

.file-tree__icon--folder { color: var(--color-secondary); }
.file-tree__icon--file { color: var(--text-muted); }
.file-tree__icon--react { color: #61dafb; }
.file-tree__icon--css { color: #264de4; }
.file-tree__icon--js { color: #f7df1e; }
.file-tree__icon--html { color: #e34c26; }
.file-tree__icon--md { color: var(--text-secondary); }

/* タブ */
.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  margin-bottom: var(--space-lg);
}

.tab {
  padding: var(--space-sm) var(--space-lg);
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: var(--font-size-sm);
  font-family: var(--font-family);
  border-bottom: 2px solid transparent;
  transition: all var(--transition-fast);
}

.tab:hover {
  color: var(--text-secondary);
}

.tab.active {
  color: var(--color-primary-light);
  border-bottom-color: var(--color-primary);
}

/* FILE: responsive.css */
/* タブレット (1023px以下共通) */
@media (max-width: 1023px) {
  .sidebar {
    transform: translateX(-100%);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .main-content {
    margin-left: 0;
  }

  .map-container--fullscreen {
    left: 0;
  }

  .header__menu-toggle {
    display: block;
  }

  .header__nav {
    display: none;
  }

  .grid--3 { grid-template-columns: repeat(2, 1fr); }
  .grid--4 { grid-template-columns: repeat(2, 1fr); }
}

/* タブレット専用 (768px-1023px) */
@media (min-width: 768px) and (max-width: 1023px) {
  .grid--2 { grid-template-columns: repeat(2, 1fr); }
  .grid--3 { grid-template-columns: repeat(2, 1fr); }

  .summary-cards {
    grid-template-columns: repeat(2, 1fr);
  }

  .card {
    padding: var(--space-md);
  }
}

/* モバイル (Android) */
@media (max-width: 767px) {
  html {
    font-size: 14px;
  }

  .header__standby-indicator {
    max-width: 260px !important;
    padding: 3px 8px !important;
    font-size: 11px !important;
    flex-wrap: wrap;
  }

  .sidebar {
    width: 100%;
    transform: translateX(-100%);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .bottom-nav {
    display: block;
  }

  .main-content {
    margin-left: 0;
    padding: var(--space-md);
    padding-bottom: calc(var(--bottom-nav-height) + var(--space-md));
  }

  .map-container {
    height: 350px;
  }

  .map-container--fullscreen {
    left: 0;
    bottom: var(--bottom-nav-height);
  }

  .grid--2,
  .grid--3,
  .grid--4 {
    grid-template-columns: 1fr;
  }

  .page-title {
    font-size: var(--font-size-lg);
  }

  .card {
    padding: var(--space-md);
  }

  .gps-panel {
    padding: var(--space-sm);
  }

  .header__nav-btn span:not(.material-icons-round) {
    display: none;
  }

  .tabs {
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }
}

/* スマホ向けインラインスタイル上書き */
@media (max-width: 767px) {
  /* カード内のグリッドを適切に折り返す */
  .card div[style*="grid-template-columns: repeat(3"] {
    grid-template-columns: repeat(2, 1fr) !important;
  }
  .card div[style*="gridTemplateColumns"][style*="repeat(3"] {
    grid-template-columns: repeat(2, 1fr) !important;
  }

  /* テーブルの水平スクロール対応 */
  .card table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* フレックスの折り返し */
  .card div[style*="display: flex"][style*="gap"] {
    flex-wrap: wrap;
  }

  /* カード内パディング調整 */
  .card {
    padding: var(--space-md) !important;
    overflow: hidden;
  }

  /* 長いテキストの折り返し */
  .card span, .card div {
    word-break: break-word;
  }

  /* フォーム入力のタッチ最適化 */
  input, select, textarea, button {
    min-height: 38px;
    font-size: 16px !important;
  }

  /* 小さいボタン・バッジは除外 */
  button[style*="padding: '2px"],
  button[style*="fontSize: '10px"],
  span[style*="fontSize: '10px"] {
    font-size: inherit !important;
    min-height: auto;
  }
}

/* 小型モバイル */
@media (max-width: 375px) {
  .bottom-nav__item {
    min-width: 48px;
    font-size: 10px;
  }

  .bottom-nav__item .material-icons-round {
    font-size: 20px;
  }

  /* さらに小さい画面ではパディングを縮小 */
  .main-content {
    padding: var(--space-sm) !important;
    padding-bottom: calc(var(--bottom-nav-height) + var(--space-sm)) !important;
  }

  .card {
    padding: var(--space-sm) !important;
  }

  .page-title {
    font-size: var(--font-size-base) !important;
  }
}

/* ランドスケープモード */
@media (max-height: 500px) and (orientation: landscape) {
  .header {
    height: 44px;
  }

  .main-content {
    margin-top: 44px;
  }

  .map-container {
    height: 250px;
  }
}

/* PC大画面 */

  <script type="text/javascript">

// ============================================================
// FILE: src/utils/constants.js
// ============================================================
(function() {
// constants.js - アプリケーション定数
//
// TaxiApp 名前空間を定義。全コンポーネント・フック・コンテキストは
// この名前空間に登録される。window直接割り当ては後方互換のためのエイリアス。
window.TaxiApp = window.TaxiApp || {
  components: {},  // UIコンポーネント
  pages: {},       // ページコンポーネント
  hooks: {},       // カスタムフック
  contexts: {},    // React Context
  utils: {},       // ユーティリティ
};

// 共通ユーティリティ（各ページから参照）
window.TaxiApp.utils.getNowTime = () => {
  const now = new Date();
  return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
};

// WMO天気コードを天候カテゴリに変換（共通ユーティリティ）
window.TaxiApp.utils.wmoToWeather = (code, fallback = '曇り') => {
  if (code === undefined || code === null) return fallback;
  if (code <= 1) return '晴れ';
  if (code <= 3 || code === 45 || code === 48) return '曇り';
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code === 95 || code === 96 || code === 99) return '雨';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return '雪';
  return fallback;
};

window.TaxiApp.utils.nominatimUrl = (lat, lng, zoom = 18) => {
  const params = new URLSearchParams({ format: 'json', lat: String(lat), lon: String(lng), zoom: String(zoom), addressdetails: '1', 'accept-language': 'ja' });
  return `https://nominatim.openstreetmap.org/reverse?${params}`;
};

// Geocoding結果から簡潔な住所を抽出（共通ユーティリティ）
window.TaxiApp.utils.formatAddress = (result) => {
  const comps = result.address_components;
  let prefecture = '', city = '', ward = '', town = '', sublocality = '';
  for (const c of comps) {
    if (c.types.includes('administrative_area_level_1')) prefecture = c.long_name;
    if (c.types.includes('locality')) city = c.long_name;
    if (c.types.includes('sublocality_level_1') || c.types.includes('ward')) ward = c.long_name;
    if (c.types.includes('sublocality_level_2')) town = c.long_name;
    if (c.types.includes('sublocality_level_3')) sublocality = c.long_name;
  }
  const parts = [ward || city || prefecture, town, sublocality].filter(Boolean);
  if (parts.length > 0) return parts.join(' ');
  return result.formatted_address.replace(/、日本$/, '').replace(/^日本、/, '');
};

// 2点間の距離(m)を計算 (Haversine)
window.TaxiApp.utils.haversineDistance = (lat1, lng1, lat2, lng2) => {
  if (lat1 == null || lng1 == null || lat2 == null || lng2 == null) return Infinity;
  if (isNaN(lat1) || isNaN(lng1) || isNaN(lat2) || isNaN(lng2)) return Infinity;
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
};

// Google Geocoder結果から、クエリ座標に近い最適な結果を選択
window.TaxiApp.utils.pickBestGeocoderResult = (results, queryLat, queryLng) => {
  const dist = TaxiApp.utils.haversineDistance;
  const MAX_DIST = 300; // 300m以内の結果のみ対象

  // 各結果に距離を付与（locationがないものは除外）
  const withDist = results
    .filter(r => r.geometry && r.geometry.location)
    .map(r => {
      const loc = r.geometry.location;
      const rLat = typeof loc.lat === 'function' ? loc.lat() : loc.lat;
      const rLng = typeof loc.lng === 'function' ? loc.lng() : loc.lng;
      return { result: r, distance: dist(queryLat, queryLng, rLat, rLng) };
    });
  if (withDist.length === 0) return results[0]; // フォールバック

  // 近い結果のみ (300m以内)
  const nearby = withDist.filter(w => w.distance <= MAX_DIST);

  // 近い結果がなければ最も近い結果を返す
  if (nearby.length === 0) {
    withDist.sort((a, b) => a.distance - b.distance);
    return withDist[0].result;
  }

  // 近い結果内でタイプ優先選択
  const typePriority = ['street_address', 'premise', 'sublocality_level_3', 'sublocality_level_2', 'route'];
  for (const t of typePriority) {
    const match = nearby.find(w => w.result.types.includes(t));
    if (match) return match.result;
  }

  // タイプ一致なしなら最も近い結果
  nearby.sort((a, b) => a.distance - b.distance);
  return nearby[0].result;
};

window.TaxiApp.utils.extractAddress = (result) => {
  const comps = result.address_components;
  let prefecture = '', city = '', ward = '', town = '', sublocality = '', chome = '', banchi = '', route = '';
  for (const c of comps) {
    if (c.types.includes('administrative_area_level_1')) prefecture = c.long_name;
    if (c.types.includes('locality')) city = c.long_name;
    if (c.types.includes('sublocality_level_1') || c.types.includes('ward')) ward = c.long_name;
    if (c.types.includes('sublocality_level_2')) town = c.long_name;
    if (c.types.includes('sublocality_level_3')) sublocality = c.long_name;
    if (c.types.includes('sublocality_level_4')) chome = c.long_name;
    if (c.types.includes('premise')) banchi = c.long_name;
    if (c.types.includes('route')) route = c.long_name;
  }
  const area = ward || city || prefecture;
  const detail = [town, sublocality, chome, banchi].filter(Boolean).join('');
  if (area && detail) return area + ' ' + detail;
  if (area && route) return area + ' ' + route;
  if (area) return area;
  return result.formatted_address
    .replace(/〒\d{3}-?\d{4}\s*/, '')
    .replace(/、日本$/, '').replace(/^日本、\s*/, '')
    .replace(/^日本\s*/, '');
};

// 場所名エイリアス適用: 住所文字列に含まれるキーワードを置換
window.TaxiApp.utils.applyPlaceAlias = (address) => {
  if (!address) return address;
  const aliases = APP_CONSTANTS.PLACE_ALIASES;
  for (const [keyword, replacement] of Object.entries(aliases)) {
    if (address.includes(keyword)) return replacement;
  }
  return address;
};

// 座標ベースの既知場所マッチング（最優先）
// KNOWN_PLACESに登録された座標のradius以内なら即座にその名称を返す
window.TaxiApp.utils.matchKnownPlace = (lat, lng) => {
  if (lat == null || lng == null || isNaN(lat) || isNaN(lng)) return null;
  const places = APP_CONSTANTS.KNOWN_PLACES;
  if (!places || places.length === 0) return null;
  const dist = TaxiApp.utils.haversineDistance;
  let best = null;
  let bestDist = Infinity;
  for (const place of places) {
    const d = dist(lat, lng, place.lat, place.lng);
    if (d <= place.radius && d < bestDist) {
      best = place.name;
      bestDist = d;
    }
  }
  return best;
};

// GPS座標から近くのランドマーク名を取得（Places API + Nominatimフォールバック）
window.TaxiApp.utils.findNearbyLandmark = (() => {
  const cache = {};
  const CACHE_KEY = 'taxi_landmark_cache';
  const MAX_CACHE = 500;
  let diskCache = null;
  // APIレート制限
  let _lastPlacesCall = 0;
  let _lastNominatimCall = 0;
  const PLACES_MIN_INTERVAL = 2000;    // Places API: 2秒間隔
  const NOMINATIM_MIN_INTERVAL = 1100; // Nominatim: 1.1秒間隔（利用規約準拠）

  function _loadDiskCache() {
    if (diskCache) return diskCache;
    try { diskCache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch { diskCache = {}; }
    return diskCache;
  }
  function _saveDiskCache(c) {
    const keys = Object.keys(c);
    if (keys.length > MAX_CACHE) keys.slice(0, keys.length - MAX_CACHE).forEach(k => delete c[k]);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } catch {}
  }

  // Places APIで検索する施設タイプ（優先度順）
  const POI_TYPES = [
    'train_station', 'bus_station', 'subway_station',
    'hospital', 'doctor', 'pharmacy',
    'local_government_office', 'city_hall', 'courthouse', 'police', 'fire_station', 'post_office',
    'school', 'university', 'library',
    'tourist_attraction', 'museum', 'park', 'amusement_park', 'zoo', 'aquarium',
    'shopping_mall', 'department_store', 'supermarket',
    'hotel', 'lodging',
    'restaurant', 'cafe',
    'bank',
    'gas_station', 'car_repair',
    'convenience_store',
    'store',
  ];

  // 距離(m)に応じた適格判定
  function isEligible(place, distM) {
    const t = place.types || [];
    // 駅・病院・役所・観光地: 200m以内
    if (t.some(x => ['train_station','bus_station','subway_station','hospital','local_government_office','city_hall','tourist_attraction','museum','park','amusement_park','zoo','aquarium','university'].includes(x))) {
      return distM <= 200;
    }
    // その他の施設: 100m以内
    return distM <= 100;
  }

  // Places APIで近くの施設を検索
  function _searchPlaces(lat, lng) {
    return new Promise((resolve) => {
      resolve(null); return;
      // レート制限チェック
      const now = Date.now();
      if (now - _lastPlacesCall < PLACES_MIN_INTERVAL) {
        resolve(null);
        return;
      }
      _lastPlacesCall = now;
      // PlacesServiceにはmap要素かdiv要素が必要
      let attrDiv = document.getElementById('places-attr');
      if (!attrDiv) {
        attrDiv = document.createElement('div');
        attrDiv.id = 'places-attr';
        attrDiv.style.display = 'none';
        document.body.appendChild(attrDiv);
      }
      const service = new google.maps.places.PlacesService(attrDiv);
      const location = new google.maps.LatLng(lat, lng);
      const dist = TaxiApp.utils.haversineDistance;

      service.nearbySearch({
        location,
        rankBy: google.maps.places.RankBy.DISTANCE,
        type: POI_TYPES[0], // typeは1つのみ指定可能、まず駅を試す
      }, (results, status) => {
        // 全タイプを一括でkeyword検索（typeフィルタなし）
        service.nearbySearch({
          location,
          radius: 200,
          language: 'ja',
        }, (allResults, allStatus) => {
          const candidates = [];
          if (allStatus === 'OK' && allResults) {
            allResults.forEach(p => {
              if (!p.name || !p.geometry || !p.geometry.location) return;
              const pLat = typeof p.geometry.location.lat === 'function' ? p.geometry.location.lat() : p.geometry.location.lat;
              const pLng = typeof p.geometry.location.lng === 'function' ? p.geometry.location.lng() : p.geometry.location.lng;
              const d = dist(lat, lng, pLat, pLng);
              if (isEligible(p, d)) {
                // 優先度スコア: タイプの優先順位
                const typeScore = Math.min(...(p.types || []).map(t => { const idx = POI_TYPES.indexOf(t); return idx >= 0 ? idx : 999; }));
                candidates.push({ name: p.name, distance: d, typeScore, types: p.types });
              }
            });
          }
          if (results && status === 'OK') {
            results.forEach(p => {
              if (!p.name || !p.geometry || !p.geometry.location) return;
              const pLat = typeof p.geometry.location.lat === 'function' ? p.geometry.location.lat() : p.geometry.location.lat;
              const pLng = typeof p.geometry.location.lng === 'function' ? p.geometry.location.lng() : p.geometry.location.lng;
              const d = dist(lat, lng, pLat, pLng);
              if (isEligible(p, d) && !candidates.find(c => c.name === p.name)) {
                const typeScore = Math.min(...(p.types || []).map(t => { const idx = POI_TYPES.indexOf(t); return idx >= 0 ? idx : 999; }));
                candidates.push({ name: p.name, distance: d, typeScore, types: p.types });
              }
            });
          }

          if (candidates.length === 0) { resolve(null); return; }

          // 優先度スコア→距離でソート
          candidates.sort((a, b) => a.typeScore - b.typeScore || a.distance - b.distance);
          resolve(candidates[0].name);
        });
      });
    });
  }

  // Nominatimで近くのPOI名を取得（フォールバック）
  async function _searchNominatim(lat, lng) {
    try {
      // レート制限チェック（Nominatim利用規約: 1秒あたり1リクエストまで）
      const now = Date.now();
      if (now - _lastNominatimCall < NOMINATIM_MIN_INTERVAL) {
        return null;
      }
      _lastNominatimCall = now;
      const res = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&zoom=18&addressdetails=1&namedetails=1&extratags=1&accept-language=ja`,
        { headers: { 'User-Agent': 'TaxiSalesSupport/3.24.0 (taxi-app)' } }
      );
      if (!res.ok) return null;
      const data = await res.json();
      // POI名が直接取得できる場合
      if (data.namedetails && data.namedetails.name && data.type !== 'residential' && data.type !== 'house') {
        return data.namedetails.name;
      }
      if (data.name && data.class !== 'highway' && data.class !== 'place') {
        return data.name;
      }
      return null;
    } catch { return null; }
  }

  return async function findNearbyLandmark(lat, lng) {
    if (lat == null || lng == null || isNaN(lat) || isNaN(lng)) return null;
    // 最優先: 座標ベースの既知場所マッチング
    const knownPlace = TaxiApp.utils.matchKnownPlace(lat, lng);
    if (knownPlace) return knownPlace;

    const key = `${lat.toFixed(5)},${lng.toFixed(5)}`;

    // メモリキャッシュ
    if (cache[key] !== undefined) return cache[key];

    // ディスクキャッシュ
    const dc = _loadDiskCache();
    if (dc[key] !== undefined) { cache[key] = dc[key]; return dc[key]; }

    // Places API
    let name = await _searchPlaces(lat, lng);

    // Nominatimフォールバック
    if (!name) name = await _searchNominatim(lat, lng);

    // エイリアス適用
    if (name) name = TaxiApp.utils.applyPlaceAlias(name);

    // キャッシュ保存（nullも保存して再検索を防止）
    cache[key] = name;
    dc[key] = name;
    diskCache = dc;
    _saveDiskCache(dc);

    return name;
  };
})();

// 逆ジオコーディング（メモリ+localStorageキャッシュ付き）
window.TaxiApp.utils.reverseGeocode = (() => {
  const CACHE_KEY = 'taxi_geocode_cache';
  const MAX_CACHE = 500;
  let memCache = null;
  let _lastNominatimGeoCall = 0;
  const NOMINATIM_MIN_MS = 1100; // Nominatim利用規約準拠
  function _loadCache() {
    if (memCache) return memCache;
    try { memCache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch { memCache = {}; }
    return memCache;
  }
  function _saveCache(c) {
    const keys = Object.keys(c);
    if (keys.length > MAX_CACHE) {
      const remove = keys.slice(0, keys.length - MAX_CACHE);
      remove.forEach(k => delete c[k]);
    }
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } catch {}
  }
  function _roundKey(lat, lng) { return `${lat.toFixed(5)},${lng.toFixed(5)}`; }

  return async function reverseGeocode(lat, lng) {
    if (lat == null || lng == null || isNaN(lat) || isNaN(lng)) return null;
    // 最優先: 座標ベースの既知場所マッチング
    const knownPlace = TaxiApp.utils.matchKnownPlace(lat, lng);
    if (knownPlace) return knownPlace;

    const cache = _loadCache();
    const key = _roundKey(lat, lng);
    if (cache[key]) return cache[key];

    // Google Maps Geocoder は無効化（Nominatimのみ使用）

    // Nominatimフォールバック（レート制限付き）
    const nowNom = Date.now();
    if (nowNom - _lastNominatimGeoCall < NOMINATIM_MIN_MS) {
      return `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    }
    _lastNominatimGeoCall = nowNom;
    try {
      const url = TaxiApp.utils.nominatimUrl(lat, lng);
      const res = await fetch(url, { headers: { 'User-Agent': 'TaxiSalesSupport/3.35 (taxi-app)' } });
      const data = await res.json();
      let name = null;
      if (data && data.address) {
        const a = data.address;
        const area = a.city || a.town || a.village || a.county || '';
        const detail = [a.suburb || a.neighbourhood || a.quarter || '', a.road || '', a.house_number || ''].filter(Boolean).join(' ');
        name = [area, detail].filter(Boolean).join(' ') || null;
      }
      if (!name) {
        name = data.display_name ? data.display_name.split(',').slice(0, 3).join(' ').trim() : `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      }
      cache[key] = name;
      memCache = cache;
      _saveCache(cache);
      return name;
    } catch {
      return `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    }
  };
})();

(function() {
// logger.js - アプリケーションロガー
window.AppLogger = (() => {
  const MAX_LOGS = 100;
  let logs = [];
  let listeners = [];
  // debug はメモリのみ（localStorage 書き込み・購読者通知をしない）
  const PERSIST_LEVELS = { warn: true, error: true, info: true };

  function loadLogs() {
    try {
      const saved = localStorage.getItem(APP_CONSTANTS.STORAGE_KEYS.LOGS);
      if (saved) {
        logs = JSON.parse(saved);
        // 旧データが重い場合に削減
        if (logs.length > MAX_LOGS) logs = logs.slice(-MAX_LOGS);
      }
    } catch (e) {
      logs = [];
    }
  }

  let _saveTimer = null;
  function saveLogs() {
    if (_saveTimer) return;
    _saveTimer = setTimeout(() => {
      _saveTimer = null;
      try {
        localStorage.setItem(APP_CONSTANTS.STORAGE_KEYS.LOGS, JSON.stringify(logs.slice(-MAX_LOGS)));
      } catch (e) { /* ignore */ }
    }, 1500);
  }

  function notify() {
    if (listeners.length === 0) return;
    const snapshot = logs.slice();
    listeners.forEach(fn => {
      try { fn(snapshot); } catch (e) { /* ignore */ }
    });
  }

  function addLog(level, message, data = null) {
    // debug はコンソールのみ（負荷低減）
    if (level === 'debug') {
      if (typeof console !== 'undefined' && console.debug) {
        console.debug(`[DEBUG] ${message}`, data || '');
      }
      return null;
    }

    const entry = {
      id: Date.now() + '_' + Math.random().toString(36).substr(2, 5),
      timestamp: new Date().toISOString(),
      level,
      message,
      data,
    };
    logs.push(entry);
    if (logs.length > MAX_LOGS) logs = logs.slice(-MAX_LOGS);
    if (PERSIST_LEVELS[level]) saveLogs();
    // 購読者はログ画面だけ想定。毎回コピーを避けるため遅延通知
    if (listeners.length > 0) {
      if (!_saveTimer) {
        // save と別に軽く debounce
        setTimeout(notify, 300);
      }
    }

    const consoleFn = level === 'error' ? console.error
      : level === 'warn' ? console.warn
      : console.log;
    consoleFn(`[${level.toUpperCase()}] ${message}`, data || '');

    return entry;
  }

  loadLogs();

  return {
    debug: (msg, data) => addLog('debug', msg, data),
    info: (msg, data) => addLog('info', msg, data),
    warn: (msg, data) => addLog('warn', msg, data),
    error: (msg, data) => addLog('error', msg, data),
    getLogs: () => logs.slice(),
    clearLogs: () => { logs = []; saveLogs(); notify(); },
    subscribe: (fn) => { listeners.push(fn); return () => { listeners = listeners.filter(l => l !== fn); }; },
  };
})();

})();

(function() {
// storage.js - localStorage管理
window.AppStorage = {
  get(key, defaultValue = null) {
    try {
      const item = localStorage.getItem(key);
      return item ? JSON.parse(item) : defaultValue;
    } catch {
      return defaultValue;
    }
  },

  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch {
      return false;
    }
  },

  remove(key) {
    try {
      localStorage.removeItem(key);
      return true;
    } catch {
      return false;
    }
  },

  getApiKey() {
    // APIキーはユーザーが設定画面から入力したもののみ使用
    // ハードコードされたキーは使用しない（セキュリティリスク）
    const key = this.get(APP_CONSTANTS.STORAGE_KEYS.API_KEY, '');
    if (key) return key;
    // フォールバック: JSON.stringifyなしで保存された生文字列に対応
    try {
      const raw = localStorage.getItem(APP_CONSTANTS.STORAGE_KEYS.API_KEY);
      if (raw && raw.trim()) {
        // 正しい形式で再保存
        this.set(APP_CONSTANTS.STORAGE_KEYS.API_KEY, raw.trim());
        return raw.trim();

    } catch {}
    return '';
  },

  setApiKey(key) {
    return this.set(APP_CONSTANTS.STORAGE_KEYS.API_KEY, key);

(function() {
// holidays.js - 日本の祝日判定ユーティリティ
// 固定祝日・ハッピーマンデー・春分/秋分の日・振替休日・国民の休日に対応

window.JapaneseHolidays = (() => {
  // 曜日名
  const DAY_NAMES = ['日', '月', '火', '水', '木', '金', '土'];

  // 曜日を取得
  function getDayOfWeek(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return DAY_NAMES[d.getDay()];
  }

  // 曜日インデックスを取得 (0=日, 6=土)
  function getDayIndex(dateStr) {
    return new Date(dateStr + 'T00:00:00').getDay();
  }

  // 春分の日を計算（1900-2099年対応）
  function getVernalEquinox(year) {
    if (year < 1900 || year > 2099) return 21;
    if (year <= 1979) return Math.floor(20.8357 + 0.242194 * (year - 1980) - Math.floor((year - 1983) / 4));
    if (year <= 2099) return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    return 21;
  }

  // 秋分の日を計算（1900-2099年対応）
  function getAutumnalEquinox(year) {
    if (year < 1900 || year > 2099) return 23;
    if (year <= 1979) return Math.floor(23.2588 + 0.242194 * (year - 1980) - Math.floor((year - 1983) / 4));
    if (year <= 2099) return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    return 23;
  }

  // 第N月曜日の日付を取得
  function getNthMonday(year, month, n) {
    const firstDay = new Date(year, month - 1, 1);
    let dayOfWeek = firstDay.getDay();
    let firstMonday = dayOfWeek <= 1 ? (1 + (1 - dayOfWeek)) : (1 + (8 - dayOfWeek));
    return firstMonday + (n - 1) * 7;
  }

  // その年の祝日一覧を生成（日付文字列 → 祝日名のMap）
  function getHolidaysForYear(year) {
    const holidays = new Map();
    const pad = (n) => String(n).padStart(2, '0');
    const key = (m, d) => `${year}-${pad(m)}-${pad(d)}`;

    // === 固定祝日 ===
    holidays.set(key(1, 1), '元日');
    holidays.set(key(2, 11), '建国記念の日');
    if (year >= 2020) holidays.set(key(2, 23), '天皇誕生日');
    else if (year >= 1989 && year <= 2018) holidays.set(key(12, 23), '天皇誕生日');
    holidays.set(key(4, 29), year >= 2007 ? '昭和の日' : 'みどりの日');
    holidays.set(key(5, 3), '憲法記念日');
    holidays.set(key(5, 4), year >= 2007 ? 'みどりの日' : '国民の休日');
    holidays.set(key(5, 5), 'こどもの日');
    if (year >= 2016) holidays.set(key(8, 11), '山の日');
    holidays.set(key(11, 3), '文化の日');
    holidays.set(key(11, 23), '勤労感謝の日');

    // === ハッピーマンデー ===
    if (year >= 2000) {
      holidays.set(key(1, getNthMonday(year, 1, 2)), '成人の日');
    } else {
      holidays.set(key(1, 15), '成人の日');
    }

    if (year >= 2003) {
      holidays.set(key(7, getNthMonday(year, 7, 3)), '海の日');
    } else if (year >= 1996) {
      holidays.set(key(7, 20), '海の日');
    }

    if (year >= 2003) {
      holidays.set(key(9, getNthMonday(year, 9, 3)), '敬老の日');
    } else if (year >= 1966) {
      holidays.set(key(9, 15), '敬老の日');
    }

    if (year >= 2000) {
      holidays.set(key(10, getNthMonday(year, 10, 2)), 'スポーツの日');
    } else {
      holidays.set(key(10, 10), '体育の日');
    }

    // === 春分の日・秋分の日 ===
    holidays.set(key(3, getVernalEquinox(year)), '春分の日');
    holidays.set(key(9, getAutumnalEquinox(year)), '秋分の日');

    // === 特例（オリンピック等） ===
    if (year === 2020) {
      holidays.delete(key(7, getNthMonday(year, 7, 3)));
      holidays.set(key(7, 23), '海の日');
      holidays.set(key(7, 24), 'スポーツの日');
      holidays.delete(key(10, getNthMonday(year, 10, 2)));
      holidays.delete(key(8, 11));
      holidays.set(key(8, 10), '山の日');
    }
    if (year === 2021) {
      holidays.delete(key(7, getNthMonday(year, 7, 3)));
      holidays.set(key(7, 22), '海の日');
      holidays.set(key(7, 23), 'スポーツの日');
      holidays.delete(key(10, getNthMonday(year, 10, 2)));
      holidays.delete(key(8, 11));
      holidays.set(key(8, 8), '山の日');
    }

    // === 振替休日 ===
    // 祝日が日曜の場合、翌月曜が振替休日
    const baseHolidays = new Map(holidays);
    for (const [dateStr] of baseHolidays) {
      const d = new Date(dateStr + 'T00:00:00');
      if (d.getDay() === 0) { // 日曜日
        let next = new Date(d);
        next.setDate(next.getDate() + 1);
        let nextStr = getLocalDateString(next);
        // 翌日も祝日なら更に翌日へ
        while (holidays.has(nextStr)) {
          next.setDate(next.getDate() + 1);
          nextStr = getLocalDateString(next);
        }
        holidays.set(nextStr, '振替休日');
      }
    }

    // === 国民の休日（祝日に挟まれた平日） ===
    const sortedDates = Array.from(holidays.keys()).sort();
    for (let i = 0; i < sortedDates.length - 1; i++) {
      const curr = new Date(sortedDates[i] + 'T00:00:00');
      const next = new Date(sortedDates[i + 1] + 'T00:00:00');
      const diff = (next - curr) / 86400000;
      if (diff === 2) {
        const between = new Date(curr);
        between.setDate(between.getDate() + 1);
        const betweenStr = getLocalDateString(between);
        if (!holidays.has(betweenStr) && between.getDay() !== 0) {
          holidays.set(betweenStr, '国民の休日');
        }
      }
    }

    return holidays;
  }

  // キャッシュ
  const _cache = {};

  // 指定日が祝日かチェック（祝日名を返す、祝日でなければnull）
  function getHolidayName(dateStr) {
    if (!dateStr) return null;
    const year = parseInt(dateStr.split('-')[0]);
    if (!_cache[year]) {
      _cache[year] = getHolidaysForYear(year);
    }
    return _cache[year].get(dateStr) || null;
  }

  // 日付情報をまとめて取得
  function getDateInfo(dateStr) {
    if (!dateStr) return { dayOfWeek: '', holiday: null, isHoliday: false, isSunday: false, isSaturday: false };
    const dayOfWeek = getDayOfWeek(dateStr);
    const dayIndex = getDayIndex(dateStr);
    const holiday = getHolidayName(dateStr);
    return {
      dayOfWeek,
      holiday,
      isHoliday: !!holiday,
      isSunday: dayIndex === 0,
      isSaturday: dayIndex === 6,
    };
  }

  return {
    getDayOfWeek,
    getHolidayName,
    getDateInfo,
    getHolidaysForYear,
  };
})();

})();

(function() {
window.NotificationService = (() => {
  function isSupported() {
    return 'Notification' in window;
  }

  function getPermission() {
    return isSupported() ? Notification.permission : 'denied';
  }

  async function requestPermission() {
    if (!isSupported()) return 'denied';
    return await Notification.requestPermission();
  }

  function isEnabled() {
    return localStorage.getItem(APP_CONSTANTS.STORAGE_KEYS.NOTIFICATION_ENABLED) === 'true';
  }

  function setEnabled(val) {
    localStorage.setItem(APP_CONSTANTS.STORAGE_KEYS.NOTIFICATION_ENABLED, val ? 'true' : 'false');
  }

  function send(title, options = {}) {
    if (!isSupported() || !isEnabled() || getPermission() !== 'granted') return;
    try {
      new Notification(title, { icon: './icons/icon-192.png', ...options });
    } catch (e) {
      AppLogger.warn('通知送信失敗: ' + e.message);
    }
  }

  function sendTroubleAlert(text) {
    if (!text || !isEnabled()) return;
    const keywords = ['遅延', '運休', '事故', '見合わせ', '運転取りやめ', '不通'];
    const hasAlert = keywords.some(kw => text.includes(kw));
    if (hasAlert) {
      send('交通情報アラート', { body: text.slice(0, 200), tag: 'trouble-alert' });
    }
  }

  return { isSupported, getPermission, requestPermission, isEnabled, setEnabled, send, sendTroubleAlert };
})();
})();

(function() {
// dataService.js - データ処理層（ビジネスロジック）
//
// 売上データの集計・分析・エクスポートを一元管理するサービス層。
// Dashboard, Analytics, Revenue の全ページがこのサービスを通じてデータにアクセスする。

window.DataService = (() => {
  // ============================================================
  // 日種別判定（平日/休日/大型連休）— 全分析関数から共有
  // ============================================================
  const _dayTypeCache = {};
  function classifyDayType(dateStr) {
    if (!dateStr) return 'weekday';
    if (_dayTypeCache[dateStr]) return _dayTypeCache[dateStr];
    try {
      const info = JapaneseHolidays.getDateInfo(dateStr);
      const type = (info.isHoliday || info.isSunday || info.isSaturday) ? 'holiday' : 'weekday';
      _dayTypeCache[dateStr] = type;
      return type;
    } catch {
      return 'weekday';
    }
  }

  function getTodayDayType() {
    return classifyDayType(getLocalDateString());
  }


  // 駅前除外パターン（奇数日チェック用）
  const _stationPattern = /駅前|旭川駅/;

  // dayTypeフィルタ: 'weekday'=平日のみ, 'holiday'=土日祝(longHoliday含む), null/undefined=全て
  function _filterByDayType(entries, dayType) {
    if (!dayType) return entries;
    return entries.filter(e => {
      const dateStr = e.date || toDateStr(e.timestamp);
      if (!dateStr) return true;
      const dt = classifyDayType(dateStr);
      if (dayType === 'weekday') return dt === 'weekday';
      return dt === 'holiday' || dt === 'longHoliday';
    });
  }

  // ============================================================
  // データ取得（キャッシュ付き）
  // ============================================================
  let _entriesCache = null;
  let _entriesCacheRaw = null;
  let _rivalCache = null;
  let _rivalCacheRaw = null;
  let _gatheringCache = null;
  let _gatheringCacheRaw = null;
  let _rawEntriesCache = null;
  let _rawEntriesCacheKey = null;

  // クーポン未収サブエントリ判定（メイン売上とは別に自動生成されるエントリ）
  const _isCouponSub = (e) => e.paymentMethod === 'uncollected' && e.memo && e.memo.includes('クーポン未収');
  // メーター金額（amount + discountAmount + couponAmount）
  const _meterAmount = (e) => (e.amount || 0) + (e.discountAmount || 0) + (e.couponAmount || 0);
  // 遠距離割の金額取得（discounts配列 → discountType/discountAmountフォールバック）
  const _longDistanceAmt = (e) => {
    if (e.discounts && Array.isArray(e.discounts)) {
      const ld = e.discounts.filter(d => d.type === 'longDistance');
      if (ld.length > 0) return ld.reduce((s, d) => s + (d.amount || 0), 0);
    }
    if (e.discountType && e.discountType.includes('longDistance') && e.discountAmount) {
      const types = e.discountType.split(',').filter(t => t && t !== 'longDistance');
      if (types.length === 0) return e.discountAmount;
    }
    return 0;
  };
  // 売上金額（メーター金額から遠距離割を除外 = 実際の売上）
  const _salesAmount = (e) => _meterAmount(e) - _longDistanceAmt(e);

  // 全エントリ（空車含む）を生データとして取得（内部CRUD用）
  // キャッシュ付き: localStorageの値が変わらなければJSON.parseをスキップ
  function _getRawEntries() {
    try {
      const saved = localStorage.getItem(APP_CONSTANTS.STORAGE_KEYS.REVENUE_DATA);
      if (saved === _rawEntriesCacheKey && _rawEntriesCache !== null) {
        return _rawEntriesCache.map(e => Object.assign({}, e));
      }
      const entries = saved ? JSON.parse(saved) : [];
      entries.forEach(e => {
        if (e.date) {
          const info = JapaneseHolidays.getDateInfo(e.date);
          e.dayOfWeek = info.dayOfWeek;
          e.holiday = info.holiday || '';
        }
      });
      _rawEntriesCacheKey = saved;
      _rawEntriesCache = entries;
      return entries.map(e => Object.assign({}, e));
    } catch {
      return [];
    }
  }

  // 旧フォーマットのクーポンデータを新フォーマットに移行
  // 旧: amount = meter - discountAmount（couponAmountは引かれていない）
  // 新: amount = meter - discountAmount - couponAmount + クーポンサブエントリ生成
  let _migrationDone = false;
  function _migrateCouponEntries() {
    if (_migrationDone) return;
    _migrationDone = true;
    try {
      const entries = _getRawEntries();
      let changed = false;
      const newEntries = [];
      entries.forEach(e => {
        if (e.couponAmount > 0 && !_isCouponSub(e)) {
          // クーポンサブエントリが存在するか確認
          const hasSub = entries.some(s =>
            s.id !== e.id && _isCouponSub(s) && s.date === e.date && s.pickup === e.pickup && s.pickupTime === e.pickupTime
          );
          if (!hasSub) {
            // 旧フォーマット: amountからcouponAmountを引いてサブエントリを作成
            AppLogger.info('クーポンデータ移行: ' + e.id + ' amount ' + e.amount + ' -> ' + (e.amount - e.couponAmount));
            e.amount = e.amount - e.couponAmount;
            changed = true;
            newEntries.push({
              id: e.id + '_coupon_migrated',
              couponParentId: e.id,
              amount: e.couponAmount,
              date: e.date,
              dayOfWeek: e.dayOfWeek || '',
              holiday: e.holiday || '',
              weather: e.weather || '',
              temperature: e.temperature != null ? e.temperature : null,
              pickup: e.pickup || '',
              pickupTime: e.pickupTime || '',
              dropoff: e.dropoff || '',
              dropoffTime: e.dropoffTime || '',
              passengers: '', gender: '', purpose: '',
              memo: 'クーポン未収（移行データ）',
              source: e.source || '',
              pickupCoords: e.pickupCoords || null,
              dropoffCoords: e.dropoffCoords || null,
              pickupLandmark: e.pickupLandmark || '',
              dropoffLandmark: e.dropoffLandmark || '',
              noPassenger: false,
              paymentMethod: 'uncollected',
              discounts: [],
              discountAmount: 0,
              discountType: '',
              couponAmount: 0,
              waitingTime: '',
              timestamp: e.timestamp,
            });
          }
        }
      });
      if (changed) {
        const allEntries = [...entries, ...newEntries];
        saveEntries(allEntries);
        AppLogger.info('クーポンデータ移行完了: ' + newEntries.length + '件のサブエントリを作成');
      }
      // 既存クーポンサブエントリにcouponParentIdが未設定なら自動付与
      const allData = changed ? [...entries, ...newEntries] : entries;
      let linkedCount = 0;
      allData.forEach(sub => {
        if (_isCouponSub(sub) && !sub.couponParentId) {
          // 同日・同乗車地・同乗車時刻でcouponAmount>0のメインエントリを探す
          const parent = allData.find(p =>
            p.id !== sub.id && !_isCouponSub(p) && p.couponAmount > 0 &&
            p.date === sub.date && p.pickup === sub.pickup && p.pickupTime === sub.pickupTime
          );
          if (parent) {
            sub.couponParentId = parent.id;
            linkedCount++;
          }
        }
      });
      if (linkedCount > 0) {
        saveEntries(allData);
        AppLogger.info('クーポン紐付け修復: ' + linkedCount + '件');
      }
    } catch (err) {
      AppLogger.warn('クーポンデータ移行エラー: ' + err.message);
    }
  }

  function getEntries() {
    _migrateCouponEntries();
    try {
      const saved = localStorage.getItem(APP_CONSTANTS.STORAGE_KEYS.REVENUE_DATA);
      if (saved === _entriesCacheRaw && _entriesCache !== null) return _entriesCache;
      const entries = _getRawEntries();
      _entriesCacheRaw = saved;
      _entriesCache = _sortByDateTimeDesc(entries.filter(e => !e.noPassenger), 'date', 'dropoffTime');
      return _entriesCache;
    } catch {
      return [];
    }
  }

  // 分析用エントリ取得（クーポンサブエントリ除外）
  function _getAnalyticsEntries(dayType) {
    return _filterByDayType(getEntries(), dayType).filter(e => !_isCouponSub(e));
  }

  // 空車記録のみ取得（待機を除く）
  function getVacantEntries() {
    try {
      const entries = _getRawEntries();
      return _sortByDateTimeDesc(entries.filter(e => e.noPassenger && e.purpose !== '待機'), 'date', 'dropoffTime');
    } catch {
      return [];
    }
  }

  // 待機記録のみ取得
  function getStandbyEntries() {
    try {
      const entries = _getRawEntries();
      return _sortByDateTimeDesc(entries.filter(e => e.noPassenger && e.purpose === '待機'), 'date', 'dropoffTime');
    } catch {
      return [];
    }
  }

  function _sortByDateTimeDesc(entries, dateKey, timeKey) {
    return entries.sort((a, b) => {
      const dateA = a[dateKey] || '';
      const dateB = b[dateKey] || '';
      if (dateA !== dateB) return dateB.localeCompare(dateA);
      const timeA = a[timeKey] || '';
      const timeB = b[timeKey] || '';
      if (timeA !== timeB) return timeB.localeCompare(timeA);
      const tsA = a.timestamp || '';
      const tsB = b.timestamp || '';
      return tsB.localeCompare(tsA);
    });
  }

  // 90日より古いログデータを削除してlocalStorage容量を確保する
  function _cleanOldDataForQuota() {
    let freed = false;
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 90);
    const cutoffStr = cutoff.toISOString().slice(0, 10);

    // GPSログ（localStorage内の古いキー）を削除
    const keysToCheck = [];
    for (let i = 0; i < localStorage.length; i++) {
      keysToCheck.push(localStorage.key(i));
    }
    for (const key of keysToCheck) {
      if (key && key.match(/^gps_log_\d{4}-\d{2}-\d{2}$/) && key.slice(8) < cutoffStr) {
        localStorage.removeItem(key);
        freed = true;
      }
    }

    // rival/gathering の90日以上古いエントリを削減
    try {
      const rivalKey = APP_CONSTANTS.STORAGE_KEYS.RIVAL_DATA;
      if (rivalKey) {
        const rivals = JSON.parse(localStorage.getItem(rivalKey) || '[]');
        const filtered = rivals.filter(e => !e.date || e.date >= cutoffStr);
        if (filtered.length < rivals.length) {
          localStorage.setItem(rivalKey, JSON.stringify(filtered));
          freed = true;
        }
      }
    } catch (_) { /* ignore */ }

    return freed;
  }

  function saveEntries(entries) {
    try {
      const sorted = _sortByDateTimeDesc([...entries], 'date', 'dropoffTime');
      const json = JSON.stringify(sorted);
      localStorage.setItem(APP_CONSTANTS.STORAGE_KEYS.REVENUE_DATA, json);
      _entriesCacheRaw = json;
      _entriesCache = sorted.filter(e => !e.noPassenger);
      _rawEntriesCache = null;
      _rawEntriesCacheKey = null;
      return true;
    } catch (e) {
      if (e.name === 'QuotaExceededError') {
        // 古いデータを削除して容量を確保し、再試行
        AppLogger.warn('ストレージ容量不足: 古いデータを削除して再試行します...');
        const cleaned = _cleanOldDataForQuota();
        if (cleaned) {
          try {
            const sorted = _sortByDateTimeDesc([...entries], 'date', 'dropoffTime');
            const json = JSON.stringify(sorted);
            localStorage.setItem(APP_CONSTANTS.STORAGE_KEYS.REVENUE_DATA, json);
            _entriesCacheRaw = json;
            _entriesCache = sorted.filter(e => !e.noPassenger);
            _rawEntriesCache = null;
            _rawEntriesCacheKey = null;
            AppLogger.info('古いデータ削除後、保存に成功しました');
            return true;
          } catch (retryErr) {
            AppLogger.error('ストレージ容量が不足しています。設定画面から不要なデータを手動で削除してください。');
            return false;
          }
        }
        AppLogger.error('ストレージ容量が不足しています。設定画面から不要なデータを手動で削除してください。');
      } else {
        AppLogger.error('売上データの保存に失敗しました', e.message);
      }
      return false;
    }
  }

  // 既存データの場所名をエイリアス・座標マッチで統一 + ランドマーク補完
  function applyPlaceAliasesToExistingData() {
    // 毎回全件スキャンすると起動が重いため、一度だけ実行
    const FLAG = 'taxi_migration_place_aliases_v1';
    if (localStorage.getItem(FLAG)) return;
    const alias = TaxiApp.utils.applyPlaceAlias;
    const matchKnown = TaxiApp.utils.matchKnownPlace;
    let changed = false;

    const entries = _getRawEntries();
    entries.forEach(e => {
      // pickup テキスト自体をエイリアス/座標で統一
      if (e.pickupCoords && e.pickupCoords.lat) {
        const known = matchKnown(e.pickupCoords.lat, e.pickupCoords.lng);
        if (known && e.pickup !== known) { e.pickup = known; changed = true; }
        if (!e.pickupLandmark && known) { e.pickupLandmark = known; changed = true; }
      }
      if (e.pickup) {
        const aliased = alias(e.pickup);
        if (aliased !== e.pickup) { e.pickup = aliased; changed = true; }
        if (!e.pickupLandmark) { e.pickupLandmark = aliased; changed = true; }
      }
      // dropoff テキスト自体をエイリアス/座標で統一
      if (e.dropoffCoords && e.dropoffCoords.lat) {
        const known = matchKnown(e.dropoffCoords.lat, e.dropoffCoords.lng);
        if (known && e.dropoff !== known) { e.dropoff = known; changed = true; }
        if (!e.dropoffLandmark && known) { e.dropoffLandmark = known; changed = true; }
      }
      if (e.dropoff) {
        const aliased = alias(e.dropoff);
        if (aliased !== e.dropoff) { e.dropoff = aliased; changed = true; }
        if (!e.dropoffLandmark) { e.dropoffLandmark = aliased; changed = true; }
      }
    });
    if (changed) {
      saveEntries(entries);
      AppLogger.info(`場所名を統一しました（エイリアス・座標マッチ適用）`);
    }

    // 他社乗車記録: 場所名統一 + ランドマーク補完
    let rivalChanged = false;
    const rivals = getRivalEntries();
    rivals.forEach(e => {
      // location テキスト自体もエイリアス/座標で統一
      if (e.locationCoords && e.locationCoords.lat) {
        const known = matchKnown(e.locationCoords.lat, e.locationCoords.lng);
        if (known && e.location !== known) { e.location = known; rivalChanged = true; }
        if (!e.locationLandmark && known) { e.locationLandmark = known; rivalChanged = true; }
      }
      if (e.location) {
        const aliased = alias(e.location);
        if (aliased !== e.location) { e.location = aliased; rivalChanged = true; }
        if (!e.locationLandmark) { e.locationLandmark = aliased; rivalChanged = true; }
      }
    });
    if (rivalChanged) {
      saveRivalEntries(rivals);
      AppLogger.info(`他社乗車データの場所名を統一しました`);
    }
    try { localStorage.setItem(FLAG, '1'); } catch (e) { /* ignore */ }
  }

  // 一回限りマイグレーション: 降車地「旭川駅前北口」→ 用途「駅移動」
  function migrateStationDropoffPurpose() {
    const KEY = 'taxi_migration_station_dropoff_purpose';
    if (localStorage.getItem(KEY)) return;
    const entries = _getRawEntries();
    let count = 0;
    entries.forEach(e => {
      if (e.dropoff === '旭川駅前北口' && e.purpose !== '駅移動') {
        e.purpose = '駅移動';
        count++;
      }
    });
    if (count > 0) {
      saveEntries(entries);
      AppLogger.info(`${count}件の降車地「旭川駅前北口」の用途を「駅移動」に更新しました`);
    }
    localStorage.setItem(KEY, '1');
  }

  // ============================================================
  // 売上記録: 現行フォーム項目以外のフィールドを削除
  // 残す: id/金額/日付/合算日/曜日祝日/乗車降車時間/人数/支払/割引/システム用
  // 消す: 天候/性別/用途/メモ(クーポン以外)/配車/地点/GPS/リピーター/待機 等
  // ============================================================
  const REVENUE_KEEP_KEYS = [
    'id', 'amount', 'date', 'dayOfWeek', 'holiday', 'shiftDate',
    'pickupTime', 'dropoffTime', 'passengers',
    'paymentMethod', 'discounts', 'discountAmount', 'discountType', 'couponAmount',
    'couponParentId', 'timestamp', 'noPassenger',
  ];

  function _slimRevenueEntry(e) {
    if (!e || typeof e !== 'object') return e;
    const slim = {};
    REVENUE_KEEP_KEYS.forEach((k) => {
      if (e[k] !== undefined) slim[k] = e[k];
    });
    // クーポン未収サブエントリ判定に memo が必要なため、該当時のみ残す
    if (e.memo && String(e.memo).includes('クーポン未収')) {
      slim.memo = e.memo;
    }
    return slim;
  }

  /**
   * 既存売上データから、削除済みフォーム項目のフィールドだけを除去する。
   * @param {{ force?: boolean }} opts force=true で再実行可能
   * @returns {{ cleaned: number, fieldsRemoved: number, alreadyDone: boolean }}
   */
  function cleanRemovedRevenueFields(opts) {
    const force = !!(opts && opts.force);
    const KEY = 'taxi_migration_slim_revenue_fields_v1';
    if (!force && localStorage.getItem(KEY)) {
      return { cleaned: 0, fieldsRemoved: 0, alreadyDone: true };
    }

    const entries = _getRawEntries();
    let cleaned = 0;
    let fieldsRemoved = 0;
    const next = entries.map((e) => {
      const beforeKeys = Object.keys(e || {});
      const slim = _slimRevenueEntry(e);
      const afterKeys = Object.keys(slim);
      const removed = beforeKeys.length - afterKeys.length;
      if (removed > 0) {
        cleaned += 1;
        fieldsRemoved += removed;
      }
      return slim;
    });

    if (cleaned > 0) {
      saveEntries(next);
      AppLogger.info(`売上記録フィールド整理: ${cleaned}件から不要項目を削除（計${fieldsRemoved}フィールド）`);
    } else {
      AppLogger.info('売上記録フィールド整理: 削除対象なし');
    }
    try { localStorage.setItem(KEY, '1'); } catch (err) { /* ignore */ }
    _notifyDataChanged('revenue');
    return { cleaned, fieldsRemoved, alreadyDone: false };
  }

  // ============================================================
  // ファイル保存・復元（売上データフォルダ）
  // ============================================================
  let _dirHandle = null; // File System Access API用

  // ── IndexedDB でフォルダハンドルを永続化 ──
  const _DB_NAME = 'taxi_app_fs';
  const _DB_STORE = 'handles';
  const _DB_KEY = 'saveDir';

  function _openHandleDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(_DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(_DB_STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function _persistHandle(handle) {
    try {
      const db = await _openHandleDB();
      const tx = db.transaction(_DB_STORE, 'readwrite');
      tx.objectStore(_DB_STORE).put(handle, _DB_KEY);
      await new Promise((r, j) => { tx.oncomplete = r; tx.onerror = j; });
      db.close();
    } catch (e) {
      AppLogger.warn('ハンドル永続化失敗: ' + e.message);
    }
  }

  async function _restoreHandle() {
    try {
      const db = await _openHandleDB();
      const tx = db.transaction(_DB_STORE, 'readonly');
      const req = tx.objectStore(_DB_STORE).get(_DB_KEY);
      const handle = await new Promise((r, j) => { req.onsuccess = () => r(req.result); req.onerror = j; });
      db.close();
      if (handle) {
        _dirHandle = handle;
        AppLogger.info('保存先フォルダを自動復元: ' + handle.name);
      }
    } catch (e) {
      AppLogger.warn('ハンドル復元失敗: ' + e.message);
    }
  }

  // 起動時に自動復元（Promiseを保持し、保存時にawait）
  const _handleReady = _restoreHandle();

  // サブフォルダのハンドルを取得（なければ自動作成）
  async function _getSubFolder(subName) {
    if (!_dirHandle) return null;
    try {
      const perm = await _dirHandle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') {
        const req = await _dirHandle.requestPermission({ mode: 'readwrite' });
        if (req !== 'granted') return null;
      }
      return await _dirHandle.getDirectoryHandle(subName, { create: true });
    } catch (e) {
      AppLogger.warn(`サブフォルダ取得失敗 (${subName}): ` + e.message);
      return null;
    }
  }

  // File System Access APIでサブフォルダにJSONを直接保存
  async function _saveToSubFolder(subName, fileName, entries, version) {
    try {
      const subDir = await _getSubFolder(subName);
      if (!subDir) return false;
      const fileHandle = await subDir.getFileHandle(fileName, { create: true });
      const writable = await fileHandle.createWritable();
      const data = JSON.stringify({ version: version, exportedAt: new Date().toISOString(), count: entries.length, entries: entries }, null, 2);
      await writable.write(data);
      await writable.close();
      AppLogger.info(`ファイル保存完了: ${subName}/${fileName} (${entries.length}件)`);
      return true;
    } catch (e) {
      AppLogger.warn(`フォルダ保存失敗 (${subName}): ` + e.message);
      return false;
    }
  }

  // ダウンロードヘルパー（JSON/CSV共通）
  function _downloadFile(filename, blob, logMessage) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    AppLogger.info(logMessage);
  }

  // ダウンロード方式でJSON保存（フォールバック）
  function _downloadBackup(entries) {
    try {
      const dateStr = getLocalDateString();
      const data = JSON.stringify({ version: APP_CONSTANTS.VERSION, exportedAt: new Date().toISOString(), count: entries.length, entries: entries }, null, 2);
      const blob = new Blob([data], { type: 'application/json;charset=utf-8;' });
      _downloadFile(`売上記録_${dateStr}.json`, blob, `バックアップダウンロード: ${entries.length}件`);
      return true;
    } catch (e) {
      AppLogger.warn('バックアップ失敗: ' + e.message);
      return false;
    }
  }

    function _downloadRivalBackup() { return null; }


  // 売上記録の自動保存（サブフォルダ「売上記録」）
  async function autoSaveToFile() {
    await _handleReady;
    if (!_dirHandle) return;
    const entries = getEntries();
    if (entries.length === 0) return;
    const dateStr = getLocalDateString();
    await _saveToSubFolder('売上記録', `売上記録_${dateStr}.json`, entries, APP_CONSTANTS.VERSION);
  }

  // 他社乗車記録の自動保存（サブフォルダ「他社乗車」）
  async function autoSaveRivalToFile() {
    await _handleReady;
    if (!_dirHandle) return;
    const entries = getRivalEntries();
    if (entries.length === 0) return;
    const dateStr = getLocalDateString();
    await _saveToSubFolder('他社乗車', `他社乗車記録_${dateStr}.json`, entries, APP_CONSTANTS.VERSION);
  }

  // 手動JSON保存（ボタン押下時）— フォルダ未設定時はダウンロード
  async function manualSaveToFile() {
    await _handleReady;
    const entries = getEntries();
    if (entries.length === 0) return;
    if (_dirHandle) {
      const dateStr = getLocalDateString();
      const ok = await _saveToSubFolder('売上記録', `売上記録_${dateStr}.json`, entries, APP_CONSTANTS.VERSION);
      if (ok) return;
    }
    _downloadBackup(entries);
  }

  async function manualSaveRivalToFile() {
    await _handleReady;
    const entries = getRivalEntries();
    if (entries.length === 0) return;
    if (_dirHandle) {
      const dateStr = getLocalDateString();
      const ok = await _saveToSubFolder('他社乗車', `他社乗車記録_${dateStr}.json`, entries, APP_CONSTANTS.VERSION);
      if (ok) return;
    }
    _downloadRivalBackup(entries);
  }

  // 保存先フォルダを選択（File System Access API）
  async function selectSaveFolder() {
    if (!window.showDirectoryPicker) {
      return { success: false, message: 'このブラウザではフォルダ直接保存がサポートされていません。ダウンロード方式で保存します。' };
    }
    try {
      _dirHandle = await window.showDirectoryPicker({ id: 'taxi-save', mode: 'readwrite', startIn: 'documents' });
      await _persistHandle(_dirHandle);
      AppLogger.info('保存先フォルダを設定・永続化: ' + _dirHandle.name)
      return { success: true, folderName: _dirHandle.name };
    } catch (e) {
      if (e.name === 'AbortError') return { success: false, message: 'フォルダ選択がキャンセルされました' };
      return { success: false, message: 'フォルダ選択に失敗: ' + e.message };
    }
  }

  // JSONファイルから復元
  // インポートデータのサニタイズ
  const MAX_IMPORT_FILE_SIZE = 10 * 1024 * 1024; // 10MB
  const MAX_STRING_LENGTH = 500;
  function _sanitizeEntry(entry) {
    const stripHtml = (s) => typeof s === 'string' ? s.replace(/<[^>]*>/g, '').slice(0, MAX_STRING_LENGTH) : '';
    const validDate = (d) => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : '';
    return {
      id: stripHtml(entry.id),
      amount: typeof entry.amount === 'number' && isFinite(entry.amount) ? Math.max(0, Math.min(entry.amount, 1000000)) : 0,
      date: validDate(entry.date),
      shiftDate: validDate(entry.shiftDate) || validDate(entry.date),
      dayOfWeek: stripHtml(entry.dayOfWeek),
      holiday: stripHtml(entry.holiday),
      weather: stripHtml(entry.weather),
      temperature: entry.temperature != null && isFinite(entry.temperature) ? entry.temperature : null,
      pickup: stripHtml(entry.pickup),
      pickupTime: stripHtml(entry.pickupTime),
      dropoff: stripHtml(entry.dropoff),
      dropoffTime: stripHtml(entry.dropoffTime),
      passengers: stripHtml(entry.passengers),
      gender: stripHtml(entry.gender),
      purpose: stripHtml(entry.purpose),
      memo: stripHtml(entry.memo),
      source: stripHtml(entry.source),
      pickupCoords: entry.pickupCoords && typeof entry.pickupCoords.lat === 'number' ? { lat: entry.pickupCoords.lat, lng: entry.pickupCoords.lng } : null,
      dropoffCoords: entry.dropoffCoords && typeof entry.dropoffCoords.lat === 'number' ? { lat: entry.dropoffCoords.lat, lng: entry.dropoffCoords.lng } : null,
      pickupLandmark: stripHtml(entry.pickupLandmark),
      dropoffLandmark: stripHtml(entry.dropoffLandmark),
      noPassenger: !!entry.noPassenger,
      paymentMethod: stripHtml(entry.paymentMethod) || 'cash',
      discounts: Array.isArray(entry.discounts) ? entry.discounts.map(d => ({ type: stripHtml(d.type), amount: parseInt(d.amount) || 0, unitPrice: d.unitPrice ? parseInt(d.unitPrice) : undefined, sheets: d.sheets ? parseInt(d.sheets) : undefined })) : [],
      discountAmount: parseInt(entry.discountAmount) || 0,
      discountType: stripHtml(entry.discountType),
      couponAmount: parseInt(entry.couponAmount) || 0,
      couponParentId: stripHtml(entry.couponParentId),
      waitingTime: stripHtml(entry.waitingTime),
      isRegisteredUser: !!entry.isRegisteredUser,
      customerName: stripHtml(entry.customerName),
      standbyInfo: entry.standbyInfo && typeof entry.standbyInfo === 'object' ? {
        locationName: stripHtml(entry.standbyInfo.locationName),
        startTime: stripHtml(entry.standbyInfo.startTime),
        endTime: stripHtml(entry.standbyInfo.endTime),
        category: stripHtml(entry.standbyInfo.category),
        lat: typeof entry.standbyInfo.lat === 'number' ? entry.standbyInfo.lat : undefined,
        lng: typeof entry.standbyInfo.lng === 'number' ? entry.standbyInfo.lng : undefined,
      } : null,
      timestamp: typeof entry.timestamp === 'string' ? entry.timestamp.slice(0, 30) : new Date().toISOString(),
    };
  }

  async function importFromFile() {
    return new Promise((resolve) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) { resolve({ success: false, message: 'ファイルが選択されませんでした' }); return; }
        if (file.size > MAX_IMPORT_FILE_SIZE) { resolve({ success: false, message: 'ファイルサイズが10MBを超えています' }); return; }
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            let entries = [];
            if (Array.isArray(data)) {
              entries = data;
            } else if (data.entries && Array.isArray(data.entries)) {
              entries = data.entries;
            } else {
              resolve({ success: false, message: 'ファイル形式が正しくありません' }); return;
            }
            // インポートデータのバリデーション
            const dateRegex = /^\d{4}-\d{2}-\d{2}$/;
            const timeRegex = /^\d{2}:\d{2}$/;
            let skippedCount = 0;
            const validEntries = entries.filter(entry => {
              if (typeof entry.amount !== 'number' || !isFinite(entry.amount) || entry.amount < 0) { skippedCount++; return false; }
              if (typeof entry.date !== 'string' || !dateRegex.test(entry.date)) { skippedCount++; return false; }
              if (entry.pickupTime && (typeof entry.pickupTime !== 'string' || !timeRegex.test(entry.pickupTime))) { skippedCount++; return false; }
              if (entry.dropoffTime && (typeof entry.dropoffTime !== 'string' || !timeRegex.test(entry.dropoffTime))) { skippedCount++; return false; }
              return true;
            });
            if (skippedCount > 0) {
              AppLogger.info(`インポート: ${skippedCount}件のデータがバリデーションで除外されました`);
            }
            // 既存データとマージ（IDで重複排除 + サニタイズ）
            const existing = _getRawEntries();
            const existingIds = new Set(existing.map(e => e.id));
            let newCount = 0;
            validEntries.forEach(entry => {
              const sanitized = _sanitizeEntry(entry);
              if (!existingIds.has(sanitized.id) && sanitized.amount > 0) {
                existing.push(sanitized);
                newCount++;
              }
            });
            existing.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            saveEntries(existing);
            AppLogger.info(`ファイルから復元: ${newCount}件追加 (合計${existing.length}件)`);
            resolve({ success: true, message: `${newCount}件の新しい記録を復元しました（合計${existing.length}件）` });
          } catch (err) {
            resolve({ success: false, message: 'ファイルの読み込みに失敗: ' + err.message });
          }
        };
        reader.readAsText(file);
      };
      input.click();
    });
  }

  // 保存フォルダが設定済みかどうか
  function hasSaveFolder() {
    return !!_dirHandle;
  }

  // ============================================================
  // クラウド同期（Vercel Blob Storage）
  // ============================================================
  function _getSyncSecret() {
    return (localStorage.getItem(APP_CONSTANTS.STORAGE_KEYS.SYNC_SECRET) || '').trim();
  }

  const ALLOWED_SYNC_TYPES = ['revenue', 'rival', 'workstatus', 'gathering', 'shifts', 'breaks'];

  // バッチ同期モード: trueの場合、_syncToCloudを即座に実行せず終業時にまとめて同期
  let _batchSyncMode = true; // デフォルトでバッチモード有効
  const _batchSyncDirty = new Set(); // 変更があったタイプを記録

  function _markDirtyForSync(type) {
    _batchSyncDirty.add(type);
  }

  // 全ダーティタイプを一括同期（終業時に呼ぶ）
  async function syncAllToCloud() {
    const types = [..._batchSyncDirty];
    _batchSyncDirty.clear();
    // 常にshiftsとbreaksも同期
    if (!types.includes('shifts')) types.push('shifts');
    if (!types.includes('breaks')) types.push('breaks');

    for (const type of types) {
      try {
        let entries = [];
        if (type === 'revenue') entries = _getRawEntries();
        else if (type === 'rival') entries = getRivalEntries();
        else if (type === 'gathering') entries = getGatheringMemos();
        else if (type === 'shifts') entries = JSON.parse(localStorage.getItem(APP_CONSTANTS.STORAGE_KEYS.SHIFTS) || '[]');
        else if (type === 'breaks') entries = JSON.parse(localStorage.getItem(APP_CONSTANTS.STORAGE_KEYS.BREAKS) || '[]');
        else continue;
        await _syncToCloud(type, entries, 0);
      } catch (e) {
        AppLogger.warn('一括同期エラー (' + type + '): ' + e.message);
      }
    }
    AppLogger.info('終業時クラウド一括同期完了: ' + types.join(', '));
  }

  // オフライン同期キュー: ネットワーク障害時に後で再試行
  const _pendingSyncQueue = [];
  let _pendingSyncProcessing = false;

  function _enqueuePendingSync(type, entries) {
    // 同じタイプのキューが既にあれば上書き（最新データを使う）
    const idx = _pendingSyncQueue.findIndex(q => q.type === type);
    if (idx >= 0) {
      _pendingSyncQueue[idx].entries = entries;
    } else {
      _pendingSyncQueue.push({ type, entries });
    }
  }

  // ネットワーク復帰時にキューを処理
  function _processPendingSync() {
    if (_pendingSyncProcessing || _pendingSyncQueue.length === 0) return;
    _pendingSyncProcessing = true;
    const item = _pendingSyncQueue.shift();
    _syncToCloud(item.type, item.entries, 0).finally(() => {
      _pendingSyncProcessing = false;
      if (_pendingSyncQueue.length > 0) {
        setTimeout(_processPendingSync, 1000);
      }
    });
  }

  // ネットワーク復帰時に自動処理
  if (typeof window !== 'undefined') {
    window.addEventListener('online', () => {
      AppLogger.info('ネットワーク復帰: 保留中の同期を処理');
      _processPendingSync();
    });
  }

  // バッチモード対応のラッパー: 即時同期またはダーティマーク
  function _syncToCloudOrDefer(type, entries) {
    if (_batchSyncMode) {
      _markDirtyForSync(type);
      return;
    }
    _syncToCloud(type, entries, 0);
  }

  async function _syncToCloud(type, entries, _retryCount) {
    if (!ALLOWED_SYNC_TYPES.includes(type)) { AppLogger.warn('不正な同期タイプ: ' + type); return; }
    const retryCount = _retryCount || 0;
    const MAX_RETRIES = 2;
    try {
      const secret = _getSyncSecret();
      const params = new URLSearchParams({ type });
      const res = await fetch(`/api/data?${params}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(secret ? { 'Authorization': `Bearer ${secret}` } : {}),
        },
        body: JSON.stringify({
          version: APP_CONSTANTS.VERSION,
          syncedAt: new Date().toISOString(),
          count: entries.length,
          entries,
        }),
      });
      if (res.ok) {
        AppLogger.info(`クラウド同期完了: ${type} (${entries.length}件)`);
      } else if (res.status >= 500 && retryCount < MAX_RETRIES) {
        const delay = 1000 * Math.pow(2, retryCount);
        await new Promise(r => setTimeout(r, delay));
        return _syncToCloud(type, entries, retryCount + 1);
      } else {
        AppLogger.warn(`クラウド同期失敗: ${res.status}`);
      }
    } catch (e) {
      if (retryCount < MAX_RETRIES) {
        const delay = 1000 * Math.pow(2, retryCount);
        await new Promise(r => setTimeout(r, delay));
        return _syncToCloud(type, entries, retryCount + 1);
      } else {
        // 全リトライ失敗: オフラインキューに追加
        AppLogger.warn('クラウド同期エラー（キューに追加）: ' + e.message);
        _enqueuePendingSync(type, entries);
      }
    }
  }

  async function loadFromCloud(type) {
    if (!ALLOWED_SYNC_TYPES.includes(type)) { AppLogger.warn('不正な同期タイプ: ' + type); return null; }
    try {
      const params = new URLSearchParams({ type });
      const res = await fetch(`/api/data?${params}`);
      if (!res.ok) return null;
      const data = await res.json();
      if (!data || typeof data !== 'object') return null;
      return Array.isArray(data.entries) ? data.entries : [];
    } catch (e) {
      AppLogger.warn('クラウド読込エラー: ' + e.message);
      return null;
    }
  }

  async function syncFromCloud(type) {
    const cloudEntries = await loadFromCloud(type);
    if (!cloudEntries || cloudEntries.length === 0) return { merged: 0 };

    const local = type === 'revenue' ? _getRawEntries() : type === 'gathering' ? getGatheringMemos() : getRivalEntries();
    const localById = new Map(local.map(e => [e.id, e]));
    let merged = 0;
    cloudEntries.forEach(entry => {
      const existing = localById.get(entry.id);
      if (!existing) {
        // ローカルに存在しない → 追加
        local.push(entry);
        localById.set(entry.id, entry);
        merged++;
      } else {
        // 両方に存在 → timestampが新しい方を採用
        const cloudTs = entry.timestamp || entry.updatedAt || '';
        const localTs = existing.timestamp || existing.updatedAt || '';
        if (cloudTs > localTs) {
          Object.assign(existing, entry);
          merged++;
        }
      }
    });
    if (merged > 0) {
      local.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      if (type === 'revenue') saveEntries(local);
      else if (type === 'gathering') saveGatheringMemos(local);
      else saveRivalEntries(local);
    }
    return { merged, total: local.length };
  }

  // 同期の競合防止フラグ
  let _autoSyncRunning = false;

  async function autoSync() {
    // 同期が既に実行中なら重複実行を防止
    if (_autoSyncRunning) {
      AppLogger.debug('自動同期: 前回の同期がまだ実行中のためスキップ');
      return null;
    }
    _autoSyncRunning = true;
    try {
      const [r1, r3, r5, r6] = await Promise.all([
        syncFromCloud('revenue'),
        syncWorkStatusFromCloud(),
        syncShiftsFromCloud(),
        syncBreaksFromCloud(),
      ]);
      const totalMerged = (r1.merged || 0) + (r5.merged || 0) + (r6.merged || 0);
      if (totalMerged > 0 || r3.merged) {
        AppLogger.info(`自動同期完了: 売上+${r1.merged}件, シフト+${r5.merged}件, 休憩+${r6.merged}件${r3.merged ? ', 勤務状態更新あり' : ''}`);
      } else {
        AppLogger.debug('自動同期: 新規データなし');
      }
      return { revenue: r1, rival: r2, workStatus: r3, gathering: r4, shifts: r5, breaks: r6 };
    } catch (e) {
      AppLogger.warn('自動同期エラー: ' + e.message);
      return null;
    } finally {
      _autoSyncRunning = false;
    }
  }

  // ============================================================
  // 勤務状態クラウド同期
  // ============================================================
  async function syncWorkStatusToCloud(workStatus) {

      if (!secret) return;
      const params = new URLSearchParams({ type: 'workstatus' });
      const res = await fetch(`/api/data?${params}`, {
